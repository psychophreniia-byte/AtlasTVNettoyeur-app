name: Build Atlas TV Cleaner APK

on:
  push:
    branches:
      - atlas-ui-v0.4.5
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify launcher pins
        run: bash scripts/verify-launcher-pins.sh

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-TV-Cleaner-v0.4.5-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
